<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro tiempo juntos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 22px; background: #f7eee9;
    font-family: Georgia, "Times New Roman", serif; color: #765b59;
  }
  .card {
    width: min(100%, 440px); padding: 32px 22px; text-align: center;
    background: #fffaf7; border: 1px solid #ead8d1; border-radius: 22px;
    box-shadow: 0 12px 35px rgba(105, 70, 65, .09);
  }
  .heart { color: #c58f91; font-size: 25px; margin-bottom: 8px; }
  h1 { font-weight: 400; font-size: clamp(27px, 7vw, 36px); margin: 0 0 9px; }
  .since { font: 13px Arial, sans-serif; letter-spacing: 1.2px; color: #a1817c; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px;
    margin: 27px 0 23px;
  }
  .unit { background: #f3e6e1; border-radius: 14px; padding: 15px 8px 13px; }
  .number { display: block; font-size: clamp(27px, 8vw, 35px); line-height: 1.15; }
  .label { display: block; margin-top: 5px; font: 11px Arial, sans-serif;
           letter-spacing: 1.3px; text-transform: uppercase; color: #987875; }
  .note { margin: 0; font-size: 16px; font-style: italic; line-height: 1.5; color: #a17b79; }
  .error { font: 12px Arial, sans-serif; color: #9a5555; }
</style>
</head>
<body>
  <main class="card">
    <div class="heart">♥</div>
    <h1>Nuestro tiempo juntos</h1>
    <div class="since">DESDE EL 2 DE MARZO DE 2025</div>
    <section class="grid" aria-live="off">
      <div class="unit"><span class="number" id="years">0</span><span class="label">Años</span></div>
      <div class="unit"><span class="number" id="months">0</span><span class="label">Meses</span></div>
      <div class="unit"><span class="number" id="days">0</span><span class="label">Días</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Horas</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutos</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Segundos</span></div>
    </section>
    <p class="note">Y cada segundo con vos es parte de mi historia favorita.</p>
  </main>
<script>
  // Fecha local de inicio: 2 de marzo de 2025, 00:00.
  const start = new Date(2025, 2, 2, 0, 0, 0);
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  function addMonths(date, count) {
    const result = new Date(date);
    const day = result.getDate();
    result.setDate(1);
    result.setMonth(result.getMonth() + count);
    const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
    result.setDate(Math.min(day, lastDay));
    return result;
  }
  function update() {
    const now = new Date();
    if (now < start) return;
    let years = now.getFullYear() - start.getFullYear();
    if (addMonths(start, years * 12) > now) years--;
    let cursor = addMonths(start, years * 12);
    let months = (now.getFullYear() - cursor.getFullYear()) * 12 + now.getMonth() - cursor.getMonth();
    if (addMonths(cursor, months) > now) months--;
    cursor = addMonths(cursor, months);
    let remainder = Math.floor((now - cursor) / 1000);
    const days = Math.floor(remainder / 86400); remainder %= 86400;
    const hours = Math.floor(remainder / 3600); remainder %= 3600;
    const minutes = Math.floor(remainder / 60);
    const seconds = remainder % 60;
    $("years").textContent = years;
    $("months").textContent = months;
    $("days").textContent = days;
    $("hours").textContent = pad(hours);
    $("minutes").textContent = pad(minutes);
    $("seconds").textContent = pad(seconds);
  }
  update();
  setInterval(update, 1000);
</script>
</body>
</html>
